name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build and Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        id: setup_java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java environment
        id: java_check
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<not set>}"
          if ! command -v java >/dev/null 2>&1; then
            echo "ERROR: Java runtime could not be detected on PATH."
            exit 1
          fi
          java -version
          JAVA_VER_OUT=$(java -version 2>&1)
          JAVA_VER_RAW=$(printf '%s\n' "$JAVA_VER_OUT" | sed -n '1s/.*version "\([^"]*\)".*/\1/p')
          if [ -z "$JAVA_VER_RAW" ]; then
            echo "ERROR: Unable to detect active Java version."
            exit 1
          fi
          if [[ "$JAVA_VER_RAW" == 1.* ]]; then
            JAVA_MAJOR=$(echo "$JAVA_VER_RAW" | cut -d. -f2)
          else
            JAVA_MAJOR=$(echo "$JAVA_VER_RAW" | cut -d. -f1 | cut -d- -f1)
          fi
          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid Java major version detected: $JAVA_VER_RAW"
            exit 1
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required, but detected Java $JAVA_MAJOR ($JAVA_VER_RAW)."
            exit 1
          fi

      - name: Set up Android SDK
        id: setup_android
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses and install SDK 36.1
        id: android_sdk
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using SDK_ROOT=${SDK_ROOT}"

          SDKMANAGER_BIN="$(command -v sdkmanager || true)"
          if [ -x "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER_BIN" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          set -o pipefail

          "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" --install "cmdline-tools;latest" "platform-tools"
          if [ -x "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi

          set +o pipefail
          yes | "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          set -o pipefail

          "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" --install "platforms;android-36" "build-tools;36.0.0"
          "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" --install "platforms;android-36.1" || true

          set +o pipefail
          yes | "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          set -o pipefail

          echo "Installed Android platforms:"
          ls -1 "${SDK_ROOT}/platforms" || true

      - name: Set up Gradle 9.3.1
        id: setup_gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore
        id: keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "./debug.keystore" ] && [ -s "./debug.keystore.base64" ]; then
            echo "Decoding ./debug.keystore.base64..."
            if ! tr -d '\r\n ' < "./debug.keystore.base64" | base64 -d > "./debug.keystore"; then
              rm -f "./debug.keystore"
            fi
          fi

          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            KEYTOOL_BIN="keytool"
            if [ -n "${JAVA_HOME:-}" ] && [ -x "${JAVA_HOME}/bin/keytool" ]; then
              KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            fi
            if ! command -v "$KEYTOOL_BIN" >/dev/null 2>&1; then
              echo "ERROR: keytool not found in configured Java installation."
              exit 1
            fi
            "$KEYTOOL_BIN" -genkeypair \
              -noprompt \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore could not be prepared or is empty."
            exit 1
          fi

      - name: Prepare Firebase configuration
        id: firebase_config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app
          if [ ! -s "app/google-services.json" ] && [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "Restoring app/google-services.json from GOOGLE_SERVICES_JSON secret..."
            printf '%s' "$GOOGLE_SERVICES_JSON" > "app/google-services.json"
          fi
          if [ ! -s "app/google-services.json" ] && [ -n "${GOOGLE_SERVICES_JSON_B64:-}" ]; then
            echo "Decoding app/google-services.json from GOOGLE_SERVICES_JSON_B64 secret..."
            if ! printf '%s' "$GOOGLE_SERVICES_JSON_B64" | tr -d '\r\n ' | base64 -d > "app/google-services.json"; then
              rm -f "app/google-services.json"
            fi
          fi
          if [ ! -s "app/google-services.json" ]; then
            echo "ERROR: app/google-services.json is missing. Add app/google-services.json to the repository or set the GOOGLE_SERVICES_JSON (or GOOGLE_SERVICES_JSON_B64) repository secret."
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          with open("app/google-services.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          project_id = data.get("project_info", {}).get("project_id", "")
          clients = data.get("client", [])
          matched = False
          has_web_client = False
          for c in clients:
              ci = c.get("client_info", {})
              pkg = ci.get("android_client_info", {}).get("package_name", "")
              app_id = ci.get("mobilesdk_app_id", "")
              if pkg == "com.aistudio.aimusic.wltv.jqr8x" and app_id == "1:1035836705469:android:cd043a7cec9572aba505d4":
                  matched = True
              for oc in c.get("oauth_client", []):
                  if oc.get("client_type") == 3:
                      has_web_client = True
          if project_id != "gen-lang-client-0518223416" or not matched or not has_web_client:
              print("ERROR: app/google-services.json does not match expected project, package, or OAuth configuration.", file=sys.stderr)
              sys.exit(1)
          print(f"Verified app/google-services.json for project={project_id}, package=com.aistudio.aimusic.wltv.jqr8x, webOAuth={has_web_client}")
          PY

      - name: Build debug APK
        id: build_apk
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/build/outputs/apk app/build/generated/res/processDebugGoogleServices
          GRADLE_OPTS="-Xmx3g -Dfile.encoding=UTF-8" \
          gradle :app:clean :app:assembleDebug \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
            --no-build-cache \
            --max-workers=2 \
            --stacktrace \
            --no-daemon 2>&1 | tee build-apk.log

      - name: Upload build failure log
        if: failure() && hashFiles('build-apk.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: build-apk-log
          path: build-apk.log

      - name: Verify debug APK and packaged Firebase resources
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ] || [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ] || [[ "$APK_PATH" != *.apk ]]; then
            echo "ERROR: Expected debug APK not found or invalid at: $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files under app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          APK_SIZE=$(wc -c < "$APK_PATH")
          echo "Verified debug APK at $APK_PATH (${APK_SIZE} bytes)."

          GS_XML=$(find app/build/generated/res/processDebugGoogleServices -name "values.xml" | head -n 1 || true)
          if [ -z "$GS_XML" ] || [ ! -s "$GS_XML" ]; then
            echo "ERROR: processDebugGoogleServices did not generate values.xml."
            exit 1
          fi
          for res_key in google_app_id default_web_client_id gcm_defaultSenderId project_id; do
            if ! grep -q "name=\"${res_key}\"" "$GS_XML"; then
              echo "ERROR: Generated Google Services resource missing key: ${res_key}"
              exit 1
            fi
          done
          echo "Verified Google Services generated XML contains required resource keys."

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT2_BIN=$(find "${SDK_ROOT}/build-tools" -type f -name "aapt2" 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$AAPT2_BIN" ]; then
            echo "ERROR: aapt2 not found under ${SDK_ROOT}/build-tools to inspect packaged APK resources."
            exit 1
          fi
          "$AAPT2_BIN" dump resources "$APK_PATH" > apk-resources.txt
          for res_key in google_app_id default_web_client_id gcm_defaultSenderId project_id google_api_key firestore_database_id; do
            if ! grep -q "string/${res_key}" apk-resources.txt; then
              echo "ERROR: APK does not contain packaged resource string/${res_key}"
              rm -f apk-resources.txt
              exit 1
            fi
            echo "Verified packaged in APK: string/${res_key}=PASS"
          done
          rm -f apk-resources.txt

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SRC_APK" ] || [ ! -s "$SRC_APK" ]; then
            echo "ERROR: Source APK is missing or empty: $SRC_APK"
            exit 1
          fi
          TMP_DIR=$(mktemp -d)
          DEST_APK="${TMP_DIR}/app-debug.apk"
          cp "$SRC_APK" "$DEST_APK"
          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "ERROR: Prepared APK release asset could not be verified: $DEST_APK"
            exit 1
          fi
          echo "asset_path=${DEST_APK}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version
          ASSET_PATH="${{ steps.prepare_release_asset.outputs.asset_path }}"
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist or is empty: ${ASSET_PATH:-<unset>}"
            exit 1
          fi
          ASSET_NAME=$(basename "$ASSET_PATH")
          if [ "$ASSET_NAME" != "app-debug.apk" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "ERROR: Release asset must be named app-debug.apk and end in .apk, got: $ASSET_NAME"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES_FILE=$(mktemp)
          trap 'rm -f "$NOTES_FILE"' EXIT

          cat <<EOF > "$NOTES_FILE"
          - Automatically generated debug APK
          - Built by GitHub Actions
          - Run number: ${GITHUB_RUN_NUMBER}
          - Run attempt: ${GITHUB_RUN_ATTEMPT}
          - Source commit SHA: ${GITHUB_SHA}
          - Intended for testing
          - Not a Play Store production release
          - Signed with the project debug keystore
          EOF

          gh release create "$RELEASE_TAG" "${ASSET_PATH}#app-debug.apk" \
            --title "$RELEASE_TITLE" \
            --target "$GITHUB_SHA" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          SDK_OUTCOME="${{ steps.android_sdk.outcome }}"
          GRADLE_OUTCOME="${{ steps.setup_gradle.outcome }}"
          KEYSTORE_OUTCOME="${{ steps.keystore.outcome }}"
          FIREBASE_OUTCOME="${{ steps.firebase_config.outcome }}"
          BUILD_OUTCOME="${{ steps.build_apk.outcome }}"
          VERIFY_OUTCOME="${{ steps.verify_apk.outcome }}"
          ARTIFACT_OUTCOME="${{ steps.upload_artifact.outcome }}"
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"

          if [ "$BUILD_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ] && [ "$ARTIFACT_OUTCOME" = "success" ] && [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url)
            HAS_ASSET=$(gh release view "$RELEASE_TAG" --json assets -q '.assets[] | select(.name == "app-debug.apk") | .name')
            if [ -z "$HAS_ASSET" ]; then
              echo "WARNING: Release $RELEASE_TAG exists at $RELEASE_URL, but app-debug.apk asset was not verified."
              {
                echo "## APK Release Warning"
                echo ""
                echo "Release \`${RELEASE_TAG}\` was created, but \`app-debug.apk\` could not be verified on the release."
                echo "The debug APK remains available in the \`app-debug-apk\` GitHub Actions workflow artifact."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Filename: app-debug.apk"
            echo "Firebase Packaged Verification: PASS"
            echo "DIRECT APK DOWNLOAD: ${DIRECT_URL}"

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "- **Release Page:** ${RELEASE_URL}"
              echo "- **Direct APK Link:** ${DIRECT_URL}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **GitHub Run:** #${GITHUB_RUN_NUMBER} (attempt ${GITHUB_RUN_ATTEMPT})"
              echo "- **Commit SHA:** \`${GITHUB_SHA}\`"
              echo "- **Firebase Config Packaged in APK:** PASS"
              echo "- **APK Filename:** \`app-debug.apk\`"
              echo ""
              echo "You can download the APK from the release **Assets** section on the release page above. The normal Actions artifact (\`app-debug-apk\`) is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$BUILD_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ] && [ "$ARTIFACT_OUTCOME" = "success" ]; then
            echo "WARNING: GitHub Release publishing failed (outcome: ${RELEASE_OUTCOME})."
            echo "The APK build succeeded and the Actions artifact named 'app-debug-apk' remains available."
            {
              echo "## APK Release Publishing Warning"
              echo ""
              echo "WARNING: GitHub Release publishing failed for tag \`${RELEASE_TAG}\`, so no release URL was published."
              echo ""
              echo "The APK build succeeded with verified Firebase resources, and the Actions artifact named \`app-debug-apk\` remains available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: Debug APK build or verification failed (sdk=${SDK_OUTCOME}, gradle=${GRADLE_OUTCOME}, keystore=${KEYSTORE_OUTCOME}, firebase=${FIREBASE_OUTCOME}, build=${BUILD_OUTCOME}, verify=${VERIFY_OUTCOME}, artifact=${ARTIFACT_OUTCOME}). No release was published."
            {
              echo "## Debug APK Build Failed"
              echo ""
              echo "Step outcomes: \`sdk=${SDK_OUTCOME}\`, \`gradle=${GRADLE_OUTCOME}\`, \`keystore=${KEYSTORE_OUTCOME}\`, \`firebase=${FIREBASE_OUTCOME}\`, \`build=${BUILD_OUTCOME}\`, \`verify=${VERIFY_OUTCOME}\`, \`artifact=${ARTIFACT_OUTCOME}\`."
              echo ""
              if [ -f "build-apk.log" ]; then
                echo "### Compiler / Build Error Lines"
                echo '```text'
                grep -E "^(e:|FAILURE:|Execution failed|\* What went wrong:)" build-apk.log | head -n 40 || true
                echo '```'
                echo "### Last 100 lines of Gradle build log"
                echo '```text'
                tail -n 100 build-apk.log || true
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
